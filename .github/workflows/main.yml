name: Build StepCounter APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed StepCounter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/app/release-key.p12"
          chmod 600 "$GITHUB_WORKSPACE/app/release-key.p12"

      - name: Verify release keystore
        run: |
          ls -l "$GITHUB_WORKSPACE/app/release-key.p12"
          test -f "$GITHUB_WORKSPACE/app/release-key.p12"

      - name: Build signed release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease

      - name: Prepare APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/StepCounter.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StepCounter
          path: release/StepCounter.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: StepCounter v${{ github.run_number }}
          body: |
            Automated StepCounter release.

            Commit: ${{ github.sha }}
          files: release/StepCounter.apk
          generate_release_notes: true

      - name: Delete release keystore
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE/app/release-key.p12"
