name: Build StepCounter APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed StepCounter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Extract versionName and set it as an environment variable
      - name: Extract versionName from build.gradle.kts
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$VERSION_NAME" ]; then
            echo "Could not find versionName in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/app/release-key.p12"
          chmod 600 "$GITHUB_WORKSPACE/app/release-key.p12"

      - name: Verify release keystore
        run: |
          ls -l "$GITHUB_WORKSPACE/app/release-key.p12"
          test -f "$GITHUB_WORKSPACE/app/release-key.p12"

      - name: Build signed release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease

      - name: Prepare APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/StepCounter.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StepCounter
          path: release/StepCounter.apk
          if-no-files-found: error

      # 2. Use the extracted VERSION_NAME for the tag and release name
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-${{ github.run_number }}
          name: StepCounter v${{ env.VERSION_NAME }}
          body: |
            Automated StepCounter release.

            Commit: ${{ github.sha }}
          files: release/StepCounter.apk
          generate_release_notes: true

      - name: Delete release keystore
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE/app/release-key.p12"
